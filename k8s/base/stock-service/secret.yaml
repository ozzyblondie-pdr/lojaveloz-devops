# Aplicar manualmente em dev:
#   kubectl create secret generic stock-service-secrets \
#     --from-literal=db-password='SUA_SENHA' \
#     --from-literal=rabbitmq-password='SUA_SENHA' \
#     -n lojaveloz
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: stock-service-secrets
  namespace: lojaveloz
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: stock-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: lojaveloz/stock-service
        property: db_password
    - secretKey: rabbitmq-password
      remoteRef:
        key: lojaveloz/stock-service
        property: rabbitmq_password
