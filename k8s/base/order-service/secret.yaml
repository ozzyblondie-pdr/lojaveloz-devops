# ATENÇÃO: Este arquivo é apenas um ESQUELETO de referência.
# Em produção, Secrets NÃO devem ser commitados no git.
# Use External Secrets Operator + Vault/AWS Secrets Manager.
# Para aplicar manualmente em desenvolvimento:
#   kubectl create secret generic order-service-secrets \
#     --from-literal=db-password='SUA_SENHA' \
#     --from-literal=rabbitmq-password='SUA_SENHA' \
#     -n lojaveloz

# Exemplo de estrutura (valores fictícios em base64):
# echo -n 'sua_senha' | base64
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
  namespace: lojaveloz
  annotations:
    # Indica que o valor real vem do External Secrets Operator
    managed-by: external-secrets
type: Opaque
# Valores abaixo são PLACEHOLDERS — nunca commitar valores reais
# data:
#   db-password: <base64>
#   rabbitmq-password: <base64>
---
# Para ambientes sem Vault, use este ExternalSecret (requer ESO instalado):
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-secrets
  namespace: lojaveloz
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: order-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: db-password
      remoteRef:
        key: lojaveloz/order-service
        property: db_password
    - secretKey: rabbitmq-password
      remoteRef:
        key: lojaveloz/order-service
        property: rabbitmq_password
