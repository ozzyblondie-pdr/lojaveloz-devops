version: "3.9"

x-common-env: &common-env
  TZ: America/Sao_Paulo
  LOG_LEVEL: info

services:
  # ─── Infraestrutura ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lojaveloz
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_MULTIPLE_DATABASES: orders,payments,stock
    secrets:
      - pg_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lojaveloz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lojaveloz
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbit_password
    secrets:
      - rabbit_password
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      - internal

  # ─── Serviços de Aplicação ────────────────────────────────────
  api-gateway:
    image: lojaveloz/api-gateway:${APP_VERSION:-latest}
    build:
      context: ./services/api-gateway
      target: production
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      ORDER_SERVICE_URL: http://order-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8082
      STOCK_SERVICE_URL: http://stock-service:8083
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - public
      - internal

  order-service:
    image: lojaveloz/order-service:${APP_VERSION:-latest}
    build:
      context: ./services/order-service
      target: production
    environment:
      <<: *common-env
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/orders
      DB_USER: lojaveloz
      DB_PASSWORD_FILE: /run/secrets/pg_password
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: order-service
    secrets:
      - pg_password
      - rabbit_password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  payment-service:
    image: lojaveloz/payment-service:${APP_VERSION:-latest}
    build:
      context: ./services/payment-service
      target: production
    environment:
      <<: *common-env
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USER: lojaveloz
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: payment-service
    secrets:
      - pg_password
      - rabbit_password
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  stock-service:
    image: lojaveloz/stock-service:${APP_VERSION:-latest}
    build:
      context: ./services/stock-service
      target: production
    environment:
      <<: *common-env
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/stock
      DB_USER: lojaveloz
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: stock-service
    secrets:
      - pg_password
      - rabbit_password
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - internal

  # ─── Observabilidade ──────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    volumes:
      - ./infra/otel/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - internal

  prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - internal

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - internal

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - internal

volumes:
  pg_data:
  rabbit_data:
  prom_data:
  grafana_data:

networks:
  public:
  internal:
    internal: true

secrets:
  pg_password:
    file: ./secrets/pg_password.txt
  rabbit_password:
    file: ./secrets/rabbit_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt
